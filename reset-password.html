<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groot – Reset Root Password</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <img src="logo.png" alt="Groot HRMS">
        <h2>Reset Root Password</h2>
        <p>Admin Lead can reset the root user's forgotten password</p>
      </div>

      <form id="resetForm" autocomplete="off">
        <div class="form-group">
          <label for="adminUsername">Your Username</label>
          <input type="text" id="adminUsername" placeholder="admin-lead" required>
        </div>
        <div class="form-group">
          <label for="adminPassword">Your Password</label>
          <input type="password" id="adminPassword" placeholder="Enter your password" required>
        </div>
        <div class="form-group">
          <label for="newPassword">New Root Password</label>
          <input type="password" id="newPassword" placeholder="New password for root" required>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
        </div>
        <div id="statusMsg" style="display:none;"></div>
        <button type="submit" class="login-btn">Reset Root Password</button>
        <a href="login.html" class="forgot-link">← Back to Login</a>
      </form>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    document.getElementById('resetForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var adminUsername   = document.getElementById('adminUsername').value.trim();
      var adminPassword   = document.getElementById('adminPassword').value;
      var newPassword     = document.getElementById('newPassword').value;
      var confirmPassword = document.getElementById('confirmPassword').value;
      var statusMsg       = document.getElementById('statusMsg');

      statusMsg.style.display = 'none';
      statusMsg.className = '';

      if (newPassword !== confirmPassword) {
        statusMsg.textContent = 'Passwords do not match.';
        statusMsg.className = 'error-msg';
        statusMsg.style.display = 'block';
        return;
      }

      if (newPassword.length < 6) {
        statusMsg.textContent = 'New password must be at least 6 characters.';
        statusMsg.className = 'error-msg';
        statusMsg.style.display = 'block';
        return;
      }

      var result = resetPassword(adminUsername, adminPassword, 'root', newPassword);
      statusMsg.textContent = result.message;
      statusMsg.className = result.success ? 'success-msg' : 'error-msg';
      statusMsg.style.display = 'block';

      if (result.success) {
        setTimeout(function () {
          window.location.href = 'login.html';
        }, 2000);
      }
    });
  </script>
</body>
</html>
